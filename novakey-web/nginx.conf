# Nginx sirve el frontend por HTTPS y reenvía /api a la API de FastAPI.
# El documento exige HTTPS; en la demostración se usa un certificado autofirmado generado al
# construir la imagen. En producción se montan certificados reales en las mismas rutas.

# HTTP: solo redirige a HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/novakey.crt;
    ssl_certificate_key /etc/nginx/certs/novakey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
