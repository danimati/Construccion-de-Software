spring.application.name=novakey-api

spring.datasource.url=${NOVAKEY_DB_URL}
spring.datasource.username=${NOVAKEY_DB_USUARIO}
spring.datasource.password=${NOVAKEY_DB_CLAVE}
spring.datasource.hikari.maximum-pool-size=20

# El esquema lo gobierna Flyway; Hibernate solo comprueba que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sin valor por defecto: la aplicación no arranca sin un secreto real (mínimo 32 bytes).
novakey.jwt.secreto=${NOVAKEY_JWT_SECRETO}
novakey.jwt.horas=8
# Si se define y no hay usuarios, crea "admin" con el rol Administrador TI en el primer arranque.
novakey.admin.clave=${NOVAKEY_ADMIN_CLAVE:}

management.endpoints.web.exposure.include=health
spring.mvc.problemdetails.enabled=true
