# Levanta NovaKey completo con el stack del documento:
#   db  -> PostgreSQL 16
#   api -> FastAPI + Uvicorn (aplica las migraciones Alembic al arrancar)
#   web -> React (Vite) servido por Nginx con HTTPS, que reenvía /api a la API
#
# Por defecto arranca el perfil demo con datos ficticios y claves conocidas.
# Para otro uso: definir NOVAKEY_PERFIL=prod y las claves NOVAKEY_DB_CLAVE,
# NOVAKEY_JWT_SECRETO, NOVAKEY_ADMIN_CLAVE y NOVAKEY_TIENDA_API_KEY.
name: novakey

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novakey
      POSTGRES_USER: novakey
      POSTGRES_PASSWORD: ${NOVAKEY_DB_CLAVE:-novakey}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novakey -d novakey"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./novakey-api-py
    depends_on:
      db:
        condition: service_healthy
    environment:
      NOVAKEY_PERFIL: ${NOVAKEY_PERFIL:-demo}
      NOVAKEY_DB_URL: postgresql+psycopg://novakey:${NOVAKEY_DB_CLAVE:-novakey}@db:5432/novakey
      NOVAKEY_JWT_SECRETO: ${NOVAKEY_JWT_SECRETO:-secreto-solo-para-demostracion-no-usar-en-produccion}
      NOVAKEY_ADMIN_CLAVE: ${NOVAKEY_ADMIN_CLAVE:-}
      NOVAKEY_TIENDA_API_KEY: ${NOVAKEY_TIENDA_API_KEY:-clave-tienda-demo}

  web:
    build: ./novakey-web
    depends_on:
      - api
    ports:
      # HTTP (redirige a HTTPS) y HTTPS.
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"

volumes:
  datos:
