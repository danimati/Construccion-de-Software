name: CI

# Integración continua de NovaKey: valida backend (FastAPI) y frontend (React/Vite)
# en cada push y pull request hacia las ramas principales.
on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novakey-api-py
    # PostgreSQL 16 real para las pruebas de integración con HTTPX.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: novakey
          POSTGRES_USER: novakey
          POSTGRES_PASSWORD: novakey
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U novakey -d novakey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOVAKEY_DB_URL: postgresql+psycopg://novakey:novakey@localhost:5433/novakey
      NOVAKEY_JWT_SECRETO: secreto-de-integracion-continua-con-mas-de-32-bytes
    steps:
      - uses: actions/checkout@v4

      - name: ¿Existe el backend en esta rama?
        id: check
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::novakey-api-py aún no existe en esta rama; se omite el backend."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.existe == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.check.outputs.existe == 'true'
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        if: steps.check.outputs.existe == 'true'
        run: ruff check .

      - name: Pruebas (pytest + cobertura)
        if: steps.check.outputs.existe == 'true'
        run: pytest --cov=novakey --cov-report=term-missing

  frontend:
    name: Frontend · build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novakey-web
    steps:
      - uses: actions/checkout@v4

      - name: ¿Existe el frontend en esta rama?
        id: check
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::novakey-web aún no existe en esta rama; se omite el frontend."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.existe == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: novakey-web/package-lock.json

      - name: Instalar dependencias
        if: steps.check.outputs.existe == 'true'
        run: npm ci

      - name: Pruebas
        if: steps.check.outputs.existe == 'true'
        run: npm test -- --run

      - name: Build
        if: steps.check.outputs.existe == 'true'
        run: npm run build

  docker:
    name: Docker · build de imágenes
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen API
        shell: bash
        run: |
          if [ -f novakey-api-py/Dockerfile ]; then
            docker build -t novakey-api:ci novakey-api-py
          else
            echo "::notice::Sin Dockerfile de API en esta rama; se omite."
          fi

      - name: Build imagen Web
        shell: bash
        run: |
          if [ -f novakey-web/Dockerfile ]; then
            docker build -t novakey-web:ci novakey-web
          else
            echo "::notice::Sin Dockerfile de Web en esta rama; se omite."
          fi
