name: CD

# Despliegue continuo: construye y publica las imágenes Docker en GitHub Container Registry
# cuando se etiqueta una versión (vX.Y.Z) o manualmente desde la pestaña Actions.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Build y push de imágenes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - imagen: novakey-api
            contexto: novakey-api-py
          - imagen: novakey-web
            contexto: novakey-web
    steps:
      - uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.imagen }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
