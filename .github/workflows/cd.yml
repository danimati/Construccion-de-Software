name: CD

# Entrega continua: al etiquetar una versión vX.Y.Z construye y publica las imágenes en GitHub
# Container Registry y hace un ensayo de despliegue: levanta esas mismas imágenes con Docker
# Compose y ejecuta la prueba de humo (infra/desplegar.sh). El paso a producción se aprueba
# ejecutando el workflow "Desplegar" con la versión verificada.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Build y push de imágenes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - imagen: novakey-api
            contexto: novakey-api-py
          - imagen: novakey-web
            contexto: novakey-web
    steps:
      - uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.imagen }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  ensayo:
    name: Ensayo de despliegue y prueba de humo
    runs-on: ubuntu-latest
    needs: publicar
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Desplegar la versión publicada
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          NOVAKEY_REGISTRO="ghcr.io/$OWNER" sh infra/desplegar.sh "${{ github.ref_name }}"

      - name: Registros si falla
        if: failure()
        run: docker compose logs --tail 100
